name: update-schedule
on:
  schedule:
    - cron: "0 21,3,9,15 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pdfplumber
      - run: python parse.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - run: |
          git config user.name "schedule-bot"
          git config user.email "bot@users.noreply.github.com"
          git add schedule.json
          git diff --cached --quiet || (git commit -m "update schedule" && git push)
